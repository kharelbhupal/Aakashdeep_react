<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title (make it more descriptive than "ACE") -->
    <title>
      Aakashdeep Construction & Engineering | Civil Engineering Services in
      Nepal
    </title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Aakashdeep Construction & Engineering delivers expert civil engineering solutions in Nepal including bridges, highways, drainage systems, geotechnical engineering, and BIM services."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Aakashdeep Construction & Engineering" />

    <!-- Canonical (important for SEO) -->
    <link rel="canonical" href="https://aakashdeep.com.np/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../src/assets/logo.svg" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a192f" />

    <!-- Open Graph (Facebook / LinkedIn sharing) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ACE | Aakashdeep Construction & Engineering"
    />
    <meta
      property="og:description"
      content="Civil engineering experts in Nepal specializing in bridges, highways, drainage, geotechnical and BIM solutions."
    />
    <meta
      property="og:image"
      content="https://aakashdeep.com.np/img/cover.jpg"
    />
    <meta property="og:url" content="https://aakashdeep.com.np/" />
    <meta
      property="og:Aakashdeep"
      content="Aakashdeep Construction & Engineering"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ACE | Construction & Engineering Nepal"
    />
    <meta
      name="twitter:description"
      content="Expert civil engineering services: bridges, highways, drainage, BIM & geotechnical solutions."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EngineeringConsulting",
        "name": "Aakashdeep Construction & Engineering",
        "url": "https://aakashdeep.com.np",
        "logo": "https://aakashdeep.com.np/img/logo.svg",
        "telephone": "+977-9840464948",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Shankhamul, Baneshwor",
          "addressLocality": "Kathmandu",
          "addressCountry": "NP"
        }
      }
    </script>
    <meta
      name="twitter:image"
      content="https://aakashdeep.com.np/img/cover.jpg"
    />
    <meta name="geo.region" content="NP" />
    <meta name="geo.placename" content="Kathmandu" />

    <!-- Fonts + Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
